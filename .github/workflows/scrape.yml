name: Scrape campsites

on:
  schedule:
    # Nightly, per infrastructure.md §5 (static info; tighten to hourly for
    # a prices-only job later if/when that's split out).
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also run the one-time town_aggregates backfill (see scraper/backfill.ts) — for entries indexed before town aggregation existed. Safe to re-run; skip for routine manual runs."
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: self-hosted
    # Explicit, not relying on the default 360-minute job timeout — OSM's
    # image-fetch step (scraper/run.ts) can realistically take a few hours
    # on its own now that each candidate is verified by a HEAD request, and
    # nothing gets written to Firestore until the very end of the script,
    # so a silent default timeout killing the job would lose the entire
    # run, not just the images.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backfill town aggregates
        if: ${{ inputs.backfill }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run backfill

      - name: Run scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SCRAPER_CONTACT_URL: ${{ vars.SCRAPER_CONTACT_URL }}
        run: npm run scrape

      - name: Upload run output
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: scraper/output/
          retention-days: 14
